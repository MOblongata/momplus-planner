*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;color:#1a1a1a;background:#f0f2f5;min-height:100vh;}
button,select,input,textarea{font-family:inherit;}
.auth-overlay{position:fixed;inset:0;background:linear-gradient(135deg,#4f46e5,#7c3aed);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px;}

.auth-card .sub{font-size:13px;color:#6b7280;text-align:center;margin-bottom:22px;line-height:1.5;}
.auth-card label{display:block;font-size:11.5px;font-weight:600;color:#374151;margin-bottom:5px;}
.auth-card input{width:100%;border:1px solid #e5e7eb;border-radius:8px;padding:10px 12px;font-size:14px;margin-bottom:12px;}
.auth-card .btn-auth{width:100%;background:var(--ind);color:#fff;border:none;border-radius:8px;padding:11px;font-size:14px;font-weight:600;cursor:pointer;margin-top:6px;}
.auth-card .btn-auth:disabled{opacity:.6;cursor:wait;}
.auth-card .msg{padding:9px 12px;border-radius:7px;font-size:12px;margin-bottom:10px;background:#fee2e2;color:#991b1b;border:1px solid #fca5a5;}
.wrap{max-width:920px;margin:0 auto;padding:22px;}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px;}
.brand{font-size:20px;font-weight:700;color:#1f2937;letter-spacing:-.4px;}
.brand .accent{color:var(--ind);}
.brand-sub{display:block;font-size:11.5px;color:#9ca3af;font-weight:500;margin-top:2px;}
.top-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.back-link{font-size:12.5px;color:#6b7280;text-decoration:none;padding:7px 12px;border:1px solid #e5e7eb;border-radius:8px;background:#fff;cursor:pointer;}
.back-link:hover{color:var(--ind);border-color:#c7d2fe;}
.user-pill{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;background:#ede9fe;color:#6d28d9;border-radius:18px;font-size:12.5px;font-weight:600;}
.user-pill .dot{width:8px;height:8px;border-radius:50%;background:#10b981;}
.btn{padding:9px 15px;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;}
.btn-primary{background:var(--ind);color:#fff;}.btn-primary:hover{background:var(--ind-d);}
.btn-ghost{background:#fff;border:1px solid #e5e7eb;color:#374151;}.btn-ghost:hover{background:#f9fafb;}
.btn:disabled{opacity:.55;cursor:wait;}
.banner{border-radius:9px;padding:11px 14px;font-size:12.5px;line-height:1.55;margin-bottom:14px;}
.banner.info{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af;}
.banner.warn{background:#fffbeb;border:1px solid #fcd34d;color:#92400e;}
.banner.err{background:#fee2e2;border:1px solid #fca5a5;color:#991b1b;}
.banner.ok{background:#dcfce7;border:1px solid #86efac;color:#166534;}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;}
.card{background:#fff;border-radius:13px;padding:18px;border:1px solid #e0e7ff;box-shadow:0 1px 4px rgba(0,0,0,.05);}
.card h3{font-size:15px;font-weight:700;color:#1f2937;margin-bottom:4px;}
.card .card-sub{font-size:12px;color:#6b7280;margin-bottom:13px;line-height:1.45;}
.card .acts{display:flex;gap:8px;flex-wrap:wrap;}
.card .acts .btn{font-size:12.5px;padding:8px 12px;}
.fcard{background:#fff;border-radius:13px;border:1px solid #e5e7eb;box-shadow:0 1px 4px rgba(0,0,0,.05);padding:20px;margin-bottom:16px;}
.f-title{font-size:19px;font-weight:800;color:#1f2937;margin-bottom:2px;}
.f-sub{font-size:12.5px;color:#6b7280;margin-bottom:16px;}
.kop-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.veld label{display:block;font-size:12px;font-weight:600;color:#374151;margin-bottom:4px;}
.veld label .req{color:#dc2626;}
.veld input,.veld select{width:100%;border:1px solid #e5e7eb;border-radius:8px;padding:9px 11px;font-size:14px;background:#fafafa;}

.instructies{background:#eef2ff;border:1px solid #c7d2fe;border-radius:10px;padding:13px 15px;font-size:13px;line-height:1.6;color:#3730a3;margin:16px 0;}

.opt input{accent-color:var(--ind);margin:0;}
.opt .olbl{font-size:9.5px;color:#6b7280;line-height:1.1;text-align:center;display:none;}
.opt:has(input:checked){border-color:var(--ind);background:#eef2ff;}
.sectie-kop{font-size:15px;font-weight:800;color:#1f2937;margin:22px 0 8px;}
.impact{background:#fff;border:1px solid #eef0f4;border-radius:10px;padding:12px 14px;margin-bottom:8px;}
.impact .iq{font-size:13.2px;font-weight:600;color:#1f2937;margin-bottom:8px;}
.impact .iopts{display:flex;gap:7px;flex-wrap:wrap;}
.impact label{display:inline-flex;align-items:center;gap:6px;border:1.5px solid #e5e7eb;border-radius:8px;padding:7px 11px;font-size:12.8px;cursor:pointer;background:#fafafa;}
.impact label:has(input:checked){border-color:var(--ind);background:#eef2ff;color:#3730a3;font-weight:600;}
.impact input{accent-color:var(--ind);}
.impact .sub-rij{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;margin:6px 0;}
textarea{width:100%;border:1px solid #e5e7eb;border-radius:9px;padding:10px 12px;font-size:13.5px;background:#fafafa;resize:vertical;min-height:80px;}
.acties{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;align-items:center;}
.toggle{display:inline-flex;gap:8px;align-items:center;font-size:12.5px;color:#374151;background:#fff;border:1px solid #e5e7eb;border-radius:9px;padding:8px 12px;cursor:pointer;}
.scoreblok{background:#fff;border:2px solid var(--ind);border-radius:13px;padding:18px 20px;margin:18px 0;}
.scoreblok h2{font-size:15px;font-weight:800;color:#312e81;margin-bottom:10px;}
.rap table{border-collapse:collapse;width:100%;font-size:12.8px;margin-bottom:12px;}
.rap td,.rap th{padding:5px 8px;border-bottom:1px solid #eef0f4;text-align:left;vertical-align:top;}
.rap th{color:#4f46e5;border-bottom:2px solid #4f46e5;font-size:12px;}
.klein{font-size:11px;color:#6b7280;line-height:1.5;margin-top:8px;}
.bedankt{background:#fff;border-radius:14px;padding:40px 24px;text-align:center;border:1px solid #e5e7eb;}
.bedankt h2{font-size:22px;color:#166534;margin-bottom:10px;}
#print-area{display:none;}
@media (max-width:640px){
  .kop-grid{grid-template-columns:1fr;}
  .kolomkop{display:none;}
  .item{grid-template-columns:repeat(var(--ncols,4),1fr);}
  .item .itxt{grid-column:1/-1;}
  .opt .olbl{display:block;}
}
@media print{
  @page{size:A4;margin:14mm 13mm;}
  body{background:#fff;}
  body.printing #app,body.printing .auth-overlay{display:none!important;}
  body.printing #print-area{display:block!important;font-size:10.5pt;color:#000;}
  #print-area h1{font-size:14pt;margin-bottom:4pt;}
  #print-area .pmeta{margin:6pt 0 8pt;font-size:10pt;line-height:1.9;}
  #print-area table{width:100%;border-collapse:collapse;font-size:9.6pt;}
  #print-area td,#print-area th{border-bottom:.5pt solid #999;padding:3pt 4pt;vertical-align:top;}
  #print-area th{font-size:8.6pt;text-align:center;}
  #print-area td.c{text-align:center;width:13mm;font-size:12pt;}
  #print-area tr{break-inside:avoid;}
  #print-area .pinstr{border:.6pt solid #666;padding:5pt 7pt;margin:6pt 0;font-size:9.6pt;}
  #print-area .pvoet{margin-top:8pt;font-size:8pt;color:#333;}
  #print-area .rap table{font-size:9.4pt;}
}
</style>
</head>

/* ===================== scoring (pure functies) ===================== */
function scoreAQ(ant){
  let dich=0,vier=0,blanco=[];
  for(let nr=1;nr<=50;nr++){
    const v=ant[nr]; // 1..4 (1 = geheel mee eens)
    if(v===undefined){blanco.push(nr);continue;}
    const eensItem=AQ_EENS.includes(nr);
    if(eensItem){ if(v<=2)dich++; vier+=(5-v); } else { if(v>=3)dich++; vier+=v; }
  }
  return {dich,vier,blanco,volledig:blanco.length===0,onvolledigHoekstra:blanco.length>5};
}
function scoreSQR(ant){
  let tot=0,blanco=[];
  for(let nr=1;nr<=75;nr++){
    const v=ant[nr]; // 1..4 (1 = helemaal eens)
    if(v===undefined){blanco.push(nr);continue;}
    if(SQR_VOORWAARTS.includes(nr)) tot+=(v===1?2:v===2?1:0);
    else tot+=(v===4?2:v===3?1:0);
  }
  return {tot,blanco};
}
function sdqItemScore(nr,v){ // v: 0 niet waar, 1 een beetje waar, 2 zeker waar
  return SDQ_OMGEKEERD.includes(nr)?2-v:v;
}
function bandVan(score,ranges){ // ranges: ["0-13","14-16",...]; geeft index
  for(let i=0;i<ranges.length;i++){const r=ranges[i];if(r==='-')return -1;const [a,b]=r.split('-').map(Number);const hi=isNaN(b)?a:b;if(score>=a&&score<=hi)return i;}
  return -1;
}
function scoreSDQ(versie,ant,impact){
  const g=SDQ_GRENZEN[versie];
  const schalen={};
  SDQ_SCHALEN.forEach(s=>{
    let som=0,n=0;
    s.items.forEach(nr=>{if(ant[nr]!==undefined){som+=sdqItemScore(nr,ant[nr]);n++;}});
    let score=null,prorata=false;
    if(n===5)score=som; else if(n>=3){score=Math.round(som*5/n);prorata=true;}
    schalen[s.id]={label:s.label,score,prorata,beantwoord:n};
  });
  const moeilijk=['emotie','gedrag','hyperactiviteit','leeftijdsgenoten'];
  const totaal=moeilijk.every(k=>schalen[k].score!==null)?moeilijk.reduce((a,k)=>a+schalen[k].score,0):null;
  const intern=(schalen.emotie.score!==null&&schalen.leeftijdsgenoten.score!==null)?schalen.emotie.score+schalen.leeftijdsgenoten.score:null;
  const extern=(schalen.gedrag.score!==null&&schalen.hyperactiviteit.score!==null)?schalen.gedrag.score+schalen.hyperactiviteit.score:null;
  // impact
  let impactScore=null;
  if(impact.q1===0) impactScore=0;
  else if(impact.q1>0){
    const vals=[impact.overstuur].concat(impact.gebieden||[]);
    const nG=SDQ[versie].gebieden.length;
    if(impact.overstuur!==undefined && (impact.gebieden||[]).filter(v=>v!==undefined).length===nG)
      impactScore=vals.reduce((a,v)=>a+SDQ_IMPACT_SCORE[v],0);
  }
  const rijen=[];
  const add=(id,label,score,max)=>{const gr=g[id];rijen.push({id,label,score,max,b3:score===null?-1:bandVan(score,gr.band3),b4:score===null?-1:bandVan(score,gr.band4),gr});};
  add('totaal','Totale moeilijkhedenscore',totaal,40);
  SDQ_SCHALEN.forEach(s=>add(s.id,s.label+(schalen[s.id].prorata?' (pro rata)':''),schalen[s.id].score,10));
  add('impact','Impactscore',impactScore,versie==='leerkracht'?6:10);
  add('internaliserend','Internaliserend (emotie + leeftijdsgenoten)',intern,20);
  add('externaliserend','Externaliserend (gedrag + hyperactiviteit)',extern,20);
  const blanco=[];for(let nr=1;nr<=25;nr++)if(ant[nr]===undefined)blanco.push(nr);
  return {rijen,blanco};
}
const B3=['Normaal','Grensgebied','Afwijkend'];
const B4=['Gemiddeld','Licht verhoogd','Hoog','Zeer hoog'];
const B4P=['Gemiddeld','Licht verlaagd','Laag','Zeer laag'];
if(typeof module!=='undefined'&&module.exports){module.exports={scoreAQ,scoreSQR,scoreSDQ,bandVan,LIJSTEN,SDQ_GRENZEN};}

  waarsch.forEach(w=>{html+='<p style="background:#fffbeb;border:1px solid #fcd34d;border-radius:7px;padding:7px 10px;font-size:12.5px;color:#92400e;margin:6px 0">'+esc(w)+'</p>';});
  html+='<h3 style="color:#312e81;font-size:14.5px;margin:12px 0 6px">Scoring (enkel voor de behandelaar)</h3>'+score;
  html+='<h3 style="color:#312e81;font-size:14.5px;margin:12px 0 6px">Antwoorden</h3>'+ant;
  if(st.opm)html+='<p style="font-size:13px"><b>Opmerkingen:</b><br>'+esc(st.opm).replace(/\n/g,'<br>')+'</p>';
  html+='<p style="font-size:10.5px;color:#6b7280;margin-top:12px">'+esc(DISCLAIMER)+'<br>'+esc(L.bron)+'<br>Automatisch verzonden via thefallacymachine.com — er wordt niets op de server bewaard.</p></div>';
  const tekst=L.arts+'\n'+kopR.map(([k,v])=>k+': '+v).join('\n')+'\n\n'+(waarsch.length?waarsch.join('\n')+'\n\n':'')+'=== SCORING ===\n'+tekstScore+'\n=== ANTWOORDEN ===\n'+antTxt+(st.opm?'\nOpmerkingen: '+st.opm+'\n':'');
  html=html.replace(/<table>/g,'<table style="border-collapse:collapse;width:100%;margin-bottom:12px">')
    .replace(/<td>/g,'<td style="padding:4px 8px;border-bottom:1px solid #eee;vertical-align:top;font-size:13px">')
    .replace(/<th>/g,'<th style="padding:4px 8px;border-bottom:2px solid #4f46e5;text-align:left;color:#4f46e5;font-size:12px">')
    .replace(/<th colspan="2">/g,'<th colspan="2" style="padding:4px 8px;border-bottom:2px solid #4f46e5;text-align:left;color:#4f46e5;font-size:12px">');
  const onderwerp=L.kort+' — '+(naam||'(naam ontbreekt)')+' — '+fmtD(V.datum);
  return {code:st.code,html,tekst,onderwerp,mailStatus:'bezig'};
}

async function verstuur(rap){
  rap.mailStatus='bezig';toonMailStatus();
  try{
    const {data:{session}}=await sb.auth.getSession();
    const res=await fetch(FN_URL,{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+(session?session.access_token:'')},
      body:JSON.stringify({lijst:rap.code,onderwerp:rap.onderwerp,html:rap.html,tekst:rap.tekst})});
    const d=await res.json().catch(()=>({}));
    if(!res.ok||d.error)throw new Error(d.error||('HTTP '+res.status));
    rap.mailStatus='ok';rap.mailNaar=d.naar;
  }catch(e){rap.mailStatus='fout';rap.mailFout=e.message||String(e);}
  toonMailStatus();
}
function toonMailStatus(){
  const m=el('mail-status');if(!m||!laatsteRapport)return;const r=laatsteRapport;
  if(r.mailStatus==='bezig')m.innerHTML='<div class="banner info">Bezig met mailen naar '+esc(currentUser.email)+'…</div>';
  else if(r.mailStatus==='ok')m.innerHTML='<div class="banner ok">&#10003; Gemaild naar <b>'+esc(r.mailNaar||currentUser.email)+'</b>.</div>';
  else m.innerHTML='<div class="banner err"><b>Mailen is niet gelukt:</b> '+esc(r.mailFout)+'<br>Het resultaat staat hieronder nog; probeer opnieuw of druk het af. <button class="btn btn-ghost" style="margin-left:6px" onclick="verstuur(laatsteRapport)">Opnieuw mailen</button></div>';
}
function renderBedankt(){
  el('app').innerHTML='<div class="bedankt"><h2>Bedankt!</h2><p style="font-size:15px;color:#374151;margin-bottom:22px">De vragenlijst is afgewerkt. Geef het toestel terug aan je behandelaar.</p>'
    +'<button class="btn btn-ghost" onclick="renderResultaat()">Resultaat tonen (behandelaar)</button></div><div id="mail-status" style="margin-top:14px"></div>';
  toonMailStatus();window.scrollTo(0,0);
}
function renderResultaat(){
  let h=kop()+'<div id="mail-status"></div><div class="scoreblok">'+laatsteRapport.html+'</div>'
    +'<div class="acties"><button class="btn btn-primary" onclick="printIngevuld()">Afdrukken / PDF</button><button class="btn btn-ghost" onclick="renderOverzicht()">Andere vragenlijst</button></div>';
  el('app').innerHTML=h;toonMailStatus();window.scrollTo(0,0);
}

/* ===================== print ===================== */
function doPrint(html){
  el('print-area').innerHTML=html;document.body.classList.add('printing');
  const klaar=()=>{document.body.classList.remove('printing');window.removeEventListener('afterprint',klaar);};
  window.addEventListener('afterprint',klaar);window.print();setTimeout(klaar,1500);
}
function printIngevuld(){if(laatsteRapport)doPrint(laatsteRapport.html);}
function printBlanco(code){
  const L=LIJSTEN[code];
  let h='<h1>'+esc(L.titel)+'</h1><div class="pmeta">'+VELDEN[L.velden].map(v=>esc(v.label)+': ______________________________').join('<br>')+'</div>';
  h+='<div class="pinstr">'+esc(L.instructie)+'</div>';
  h+='<table><tr><th style="text-align:left">Stelling</th>'+L.labels.map(l=>'<th>'+esc(l)+'</th>').join('')+'</tr>';
  L.items.forEach(it=>{h+='<tr><td>'+it.nr+'. '+esc(it.tekst)+'</td>'+L.labels.map(()=>'<td class="c">&#9675;</td>').join('')+'</tr>';});
  h+='</table>';
  if(L.sdq){
    const S=SDQ[L.sdq];const bx=a=>a.map(o=>'&#9744; '+esc(o)).join(' &nbsp; ');
    h+='<div style="break-before:page"></div><p style="margin:8pt 0 4pt"><b>'+esc(S.impactVraag)+'</b><br>'+bx(SDQ_Q1)+'</p>';
    h+='<p style="margin:6pt 0"><i>'+(L.sdq==='jongere'?'Als je “Ja” hebt geantwoord, wil je dan alsjeblieft de volgende vragen over deze moeilijkheden beantwoorden?':'Als u “Ja” heeft geantwoord, wilt u dan alstublieft de volgende vragen over deze moeilijkheden beantwoorden?')+'</i></p>';
    h+='<p style="margin:6pt 0">&bull; Hoe lang bestaan deze moeilijkheden?<br>'+bx(SDQ_DUUR)+'</p>';
    h+='<p style="margin:6pt 0">&bull; '+esc(S.overstuur)+'<br>'+bx(SDQ_IMPACT_OPTS)+'</p>';
    h+='<p style="margin:6pt 0">&bull; '+esc(S.belemmeren)+'</p><table><tr><th></th>'+SDQ_IMPACT_OPTS.map(o=>'<th>'+esc(o)+'</th>').join('')+'</tr>'+S.gebieden.map(g=>'<tr><td>'+esc(g)+'</td>'+SDQ_IMPACT_OPTS.map(()=>'<td class="c">&#9744;</td>').join('')+'</tr>').join('')+'</table>';
    h+='<p style="margin:6pt 0">&bull; '+esc(S.belasten)+'<br>'+bx(SDQ_IMPACT_OPTS)+'</p>';
  }
  h+='<p style="margin-top:10pt"><b>'+(L.sdq==='jongere'?'Heb je opmerkingen?':'Opmerkingen:')+'</b><br><br>_______________________________________________________________________________<br><br>_______________________________________________________________________________</p>';
  h+='<div class="pvoet">'+esc(L.bron)+'</div>';
  doPrint(h);
}

/* ===================== auth ===================== */
async function doLogin(){
  const email=el('auth-email').value.trim(),pw=el('auth-pw').value;
  if(!email||!pw){el('auth-msg').innerHTML='<div class="msg">Vul email en wachtwoord in.</div>';return;}
  const b=el('auth-btn');b.disabled=true;b.textContent='Bezig…';
  const {error}=await sb.auth.signInWithPassword({email,password:pw});
  b.disabled=false;b.textContent='Inloggen';
  if(error){el('auth-msg').innerHTML='<div class="msg">'+esc(error.message)+'</div>';return;}
  el('auth-msg').innerHTML='';onLoggedIn();
}
async function onLoggedIn(){
  const {data:{user}}=await sb.auth.getUser();currentUser=user;
  let ok=false;
  try{const {data}=await sb.from('user_tool_access').select('tool_id').eq('user_id',user.id).eq('tool_id',TOOL_ID).maybeSingle();ok=!!data;}catch(_){}
  el('auth-overlay').style.display='none';
  if(!ok){el('app').innerHTML='<div class="banner err">Je hebt (nog) geen toegang tot de vragenlijsten. Vraag een beheerder om toegang.</div><a class="back-link" href="index.html">&larr; Hoofdpagina</a>';el('app').style.display='block';return;}
  const code=params.get('lijst');
  el('app').style.display='block';
  if(code&&LIJSTEN[code])renderForm(code);else renderOverzicht();
}
(function init(){
  if(!window.supabase){document.body.insertAdjacentHTML('afterbegin','<div class="wrap"><div class="banner err">De pagina kon niet laden. Controleer de internetverbinding.</div></div>');return;}
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
  sb.auth.getSession().then(({data:{session}})=>{if(session)onLoggedIn();else el('auth-overlay').style.display='flex';});
})();
</script>
