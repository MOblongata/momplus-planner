<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>WHODAS 2.0</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{color-scheme:light;--ind:#4f46e5;--ind-d:#4338ca;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;color:#1a1a1a;background:#f0f2f5;min-height:100vh;}
button{font-family:inherit;}
/* ===== Auth overlay (arts-modus) ===== */
.auth-overlay{position:fixed;inset:0;background:linear-gradient(135deg,#4f46e5,#7c3aed);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px;}
.auth-card{background:#fff;border-radius:14px;padding:30px;max-width:380px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.2);}
.auth-card h1{font-size:22px;font-weight:700;color:#1f2937;margin-bottom:6px;text-align:center;}
.auth-card .sub{font-size:13px;color:#6b7280;text-align:center;margin-bottom:22px;line-height:1.5;}
.auth-card label{display:block;font-size:11.5px;font-weight:600;color:#374151;margin-bottom:5px;}
.auth-card input{width:100%;border:1px solid #e5e7eb;border-radius:8px;padding:10px 12px;font-size:14px;margin-bottom:12px;font-family:inherit;}
.auth-card input:focus{outline:none;border-color:var(--ind);box-shadow:0 0 0 3px rgba(79,70,229,.15);}
.auth-card .btn-auth{width:100%;background:var(--ind);color:#fff;border:none;border-radius:8px;padding:11px;font-size:14px;font-weight:600;cursor:pointer;margin-top:6px;}
.auth-card .btn-auth:hover{background:var(--ind-d);}.auth-card .btn-auth:disabled{opacity:.6;cursor:wait;}
.auth-card .msg{padding:9px 12px;border-radius:7px;font-size:12px;margin-bottom:10px;}
.auth-card .msg.err{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5;}
/* ===== Frame ===== */
.wrap{max-width:920px;margin:0 auto;padding:22px;}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px;}
.brand{font-size:20px;font-weight:700;color:#1f2937;letter-spacing:-.4px;}
.brand .accent{color:var(--ind);}
.brand-sub{display:block;font-size:11.5px;color:#9ca3af;font-weight:500;margin-top:2px;}
.top-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.back-link{font-size:12.5px;color:#6b7280;text-decoration:none;padding:7px 12px;border:1px solid #e5e7eb;border-radius:8px;background:#fff;cursor:pointer;}
.back-link:hover{background:#f9fafb;color:var(--ind);border-color:#c7d2fe;}
.user-pill{display:inline-flex;align-items:center;gap:7px;padding:7px 13px;background:#ede9fe;color:#6d28d9;border-radius:18px;font-size:12.5px;font-weight:600;}
.user-pill .dot{width:8px;height:8px;border-radius:50%;background:#10b981;}
.btn-logout{background:#fff;border:1px solid #e5e7eb;color:#6b7280;padding:7px 12px;border-radius:8px;font-size:12px;cursor:pointer;}
.btn-logout:hover{background:#fee2e2;color:#991b1b;border-color:#fca5a5;}
.btn{padding:9px 15px;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;}
.btn-primary{background:var(--ind);color:#fff;}.btn-primary:hover{background:var(--ind-d);}
.btn-ghost{background:#fff;border:1px solid #e5e7eb;color:#374151;}.btn-ghost:hover{background:#f9fafb;}
.btn:disabled{opacity:.55;cursor:wait;}
.banner{border-radius:9px;padding:11px 14px;font-size:12.5px;line-height:1.55;margin-bottom:14px;}
.banner.info{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af;}
.banner.warn{background:#fffbeb;border:1px solid #fcd34d;color:#92400e;}
.banner.err{background:#fee2e2;border:1px solid #fca5a5;color:#991b1b;}
.banner.ok{background:#dcfce7;border:1px solid #86efac;color:#166534;}
/* ===== Dashboard-kaarten ===== */
.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.card{background:#fff;border-radius:13px;padding:18px;border:1px solid #e0e7ff;box-shadow:0 1px 4px rgba(0,0,0,.05);}
.card h3{font-size:15px;font-weight:700;color:#1f2937;margin-bottom:4px;display:flex;align-items:center;gap:8px;}
.card .card-sub{font-size:12px;color:#6b7280;margin-bottom:13px;line-height:1.45;}
.card .acts{display:flex;gap:8px;flex-wrap:wrap;}
.card .acts .btn{font-size:12.5px;padding:8px 12px;}
.linkbox{background:#fff;border-radius:13px;padding:16px 18px;border:1px solid #e0e7ff;box-shadow:0 1px 4px rgba(0,0,0,.05);margin-bottom:16px;}
.linkbox h3{font-size:14px;font-weight:700;color:#1f2937;margin-bottom:8px;}
.linkbox p{font-size:12.5px;color:#6b7280;margin-bottom:10px;line-height:1.5;}
.linkbox input{border:1px solid #e5e7eb;border-radius:8px;padding:9px 11px;font-size:13.5px;font-family:inherit;width:100%;max-width:340px;}
.linkbox input:focus{outline:none;border-color:var(--ind);}
.mailpanel{background:#fff;border-radius:13px;padding:16px 18px;border:1px solid #c7d2fe;box-shadow:0 1px 4px rgba(0,0,0,.05);margin-bottom:16px;}
.mailpanel h3{font-size:14px;font-weight:700;color:#1f2937;margin-bottom:8px;}
.mailpanel label{display:block;font-size:12px;color:#6b7280;margin:8px 0 4px;}
.mailpanel input{border:1px solid #e5e7eb;border-radius:8px;padding:9px 11px;font-size:13.5px;font-family:inherit;width:100%;}
.mailpanel input:focus{outline:none;border-color:var(--ind);}
.mailpanel textarea{min-height:230px;background:#fff;}
.mailpanel .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center;}
.mailpanel .klein{font-size:11.5px;color:#6b7280;}
.linkurl{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap;}
.linkurl code{font-size:11px;background:#f3f4f6;border:1px solid #e5e7eb;border-radius:7px;padding:8px 10px;word-break:break-all;flex:1;min-width:220px;color:#374151;}
/* ===== Formulier ===== */
.fcard{background:#fff;border-radius:13px;border:1px solid #e5e7eb;box-shadow:0 1px 4px rgba(0,0,0,.05);padding:20px;margin-bottom:16px;}
.f-title{font-size:19px;font-weight:800;color:#1f2937;letter-spacing:-.3px;margin-bottom:2px;}
.f-praktijk{font-size:12.5px;color:#6b7280;margin-bottom:16px;}
.kop-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.kop-grid .veld.breed{grid-column:1/-1;}
.veld label{display:block;font-size:12px;font-weight:600;color:#374151;margin-bottom:4px;}
.veld label .req{color:#dc2626;}
.veld input{width:100%;border:1px solid #e5e7eb;border-radius:8px;padding:9px 11px;font-size:14px;font-family:inherit;background:#fafafa;}
.veld input:focus{outline:none;border-color:var(--ind);background:#fff;box-shadow:0 0 0 3px rgba(79,70,229,.12);}
.veld.missend input{border-color:#f87171;background:#fef2f2;}
.instructies{background:#eef2ff;border:1px solid #c7d2fe;border-radius:10px;padding:13px 15px;font-size:13px;line-height:1.6;color:#3730a3;margin:16px 0;}
.instructies b{color:#312e81;}
/* medicatievraag */
.medvraag{border:2px solid #fbbf24;background:#fffbeb;border-radius:10px;padding:14px 16px;margin-bottom:16px;}
.medvraag.missend{border-color:#f87171;background:#fef2f2;}
.medvraag .mv-q{font-weight:700;font-size:13.5px;color:#78350f;margin-bottom:9px;}
.medvraag .mv-opts{display:flex;gap:8px;flex-wrap:wrap;}
.medvraag label{display:inline-flex;align-items:center;gap:7px;background:#fff;border:1.5px solid #e5e7eb;border-radius:9px;padding:8px 13px;font-size:13px;cursor:pointer;user-select:none;}
.medvraag label:has(input:checked){border-color:var(--ind);background:#eef2ff;color:#3730a3;font-weight:600;}
.medvraag input{accent-color:var(--ind);}
/* items */
.sectie-kop{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:22px 0 4px;flex-wrap:wrap;}
.sectie-kop h2{font-size:15px;font-weight:800;color:#1f2937;}
.sectie-kop .schaal-uitleg{font-size:11.5px;color:#6b7280;}
.subsectie{font-size:12.5px;font-weight:700;color:#6d28d9;margin:14px 0 2px;font-style:italic;}
.kolomkop{display:grid;grid-template-columns:minmax(0,1fr) repeat(var(--ncols,4),74px);gap:6px;padding:6px 10px 4px;font-size:10.5px;font-weight:700;color:#6b7280;text-transform:uppercase;letter-spacing:.03em;position:sticky;top:0;background:#f0f2f5;z-index:5;}
.kolomkop span{text-align:center;line-height:1.25;}
.item{display:grid;grid-template-columns:minmax(0,1fr) repeat(var(--ncols,4),74px);gap:6px;align-items:center;background:#fff;border:1px solid #eef0f4;border-radius:10px;padding:9px 10px;margin-bottom:6px;}
.item.beantwoord{border-color:#bbf7d0;background:#fbfefc;}
.item.missend{border-color:#f87171;background:#fef2f2;}
.item .itxt{font-size:13.2px;line-height:1.45;color:#1f2937;}
.item .itxt .inr{font-weight:700;color:#6b7280;margin-right:5px;}
.opt{display:flex;flex-direction:column;align-items:center;gap:3px;border:1.5px solid #e5e7eb;border-radius:8px;padding:6px 2px 5px;cursor:pointer;user-select:none;background:#fafafa;min-height:46px;justify-content:center;}
.opt:hover{border-color:#c7d2fe;background:#fff;}
.opt input{accent-color:var(--ind);margin:0;}
.opt .olbl{font-size:9.5px;color:#6b7280;line-height:1.1;text-align:center;}
.opt .onr{font-size:11px;font-weight:700;color:#374151;line-height:1;}
.opt:has(input:checked){border-color:var(--ind);background:#eef2ff;}
.opt:has(input:checked) .onr,.opt:has(input:checked) .olbl{color:#3730a3;}
/* bijwerkingen */
.bw-kop{font-weight:700;font-size:13.5px;color:#1f2937;margin:4px 0 2px;}
.bw-kolomvraag{font-size:12px;color:#6b7280;margin-bottom:8px;}
textarea{width:100%;border:1px solid #e5e7eb;border-radius:9px;padding:10px 12px;font-size:13.5px;font-family:inherit;background:#fafafa;resize:vertical;min-height:84px;}
textarea:focus{outline:none;border-color:var(--ind);background:#fff;}
/* score */
.scoreblok{background:#fff;border:2px solid var(--ind);border-radius:13px;padding:18px 20px;margin:18px 0;}
.scoreblok h2{font-size:15px;font-weight:800;color:#312e81;margin-bottom:3px;}
.scoreblok .sb-sub{font-size:11.5px;color:#6b7280;margin-bottom:13px;}
.sb-tabel{width:100%;border-collapse:collapse;font-size:12.8px;margin-bottom:13px;}
.sb-tabel td{padding:6px 8px;border-bottom:1px solid #f3f4f6;}
.sb-tabel td:last-child{text-align:right;font-weight:700;color:#1f2937;white-space:nowrap;}
.crit{display:flex;gap:9px;align-items:flex-start;padding:7px 9px;border-radius:8px;margin-bottom:5px;font-size:12.8px;}
.crit.ja{background:#fef3c7;border:1px solid #fcd34d;}
.crit.nee{background:#f9fafb;border:1px solid #eef0f4;color:#6b7280;}
.crit .cv{font-weight:800;white-space:nowrap;}
.crit.ja .cv{color:#92400e;}.crit.nee .cv{color:#9ca3af;}
.crit .cd{font-size:11px;color:#9ca3af;display:block;margin-top:1px;}
.score-noot{font-size:11.5px;color:#92400e;background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:9px 11px;line-height:1.5;}
/* verzendbalk */
.verzendbalk{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:20px 0;}
.verzendbalk .btn-verzend{font-size:14.5px;padding:12px 22px;}
.klein{font-size:11.5px;color:#9ca3af;line-height:1.55;}
.footer-teksten{margin-top:26px;border-top:1px solid #e5e7eb;padding-top:14px;display:flex;flex-direction:column;gap:8px;}
/* bevestiging */
.done-card{background:#fff;border-radius:14px;padding:38px 30px;text-align:center;max-width:520px;margin:60px auto;box-shadow:0 8px 30px rgba(0,0,0,.08);}
.done-card .big{font-size:44px;margin-bottom:12px;}
.done-card h2{font-size:19px;color:#1f2937;margin-bottom:9px;}
.done-card p{font-size:13.5px;color:#6b7280;line-height:1.6;}
@media(max-width:680px){
  .cards{grid-template-columns:1fr;}
  .kop-grid{grid-template-columns:1fr;}
  .kolomkop{display:none;}
  .item{grid-template-columns:1fr;gap:8px;}
  .item .opts-rij{display:grid;grid-template-columns:repeat(var(--ncols,4),1fr);gap:6px;}
  .opt{min-height:44px;}
}
@media(min-width:681px){.item .opts-rij{display:contents;}}
/* ===== PRINT ===== */
#print-area{display:none;}
@media print{
  body{background:#fff;}
  body.printing > :not(#print-area){display:none !important;}
  body.printing #print-area{display:block;}
  @page{size:A4;margin:12mm 13mm;}
  #print-area{font-family:Georgia,'Times New Roman',serif;color:#000;font-size:10.2pt;line-height:1.3;}
  .p-band{background:#000;color:#fff;font-family:-apple-system,'Segoe UI',sans-serif;font-weight:700;text-align:center;padding:4pt 8pt;font-size:11pt;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .p-kop{margin:7pt 0 4pt;font-size:10pt;}
  .p-kop .p-veld{display:inline-block;margin-right:14pt;margin-bottom:3pt;}
  .p-kop .p-lijn{display:inline-block;border-bottom:1px solid #000;min-width:110pt;padding:0 3pt;font-weight:700;}
  .p-instr{margin:5pt 0;font-size:9.6pt;}
  .p-med{margin:5pt 0 7pt;font-weight:700;font-size:9.8pt;}
  .p-med .p-chk{font-family:'Segoe UI Symbol',sans-serif;margin:0 3pt 0 10pt;}
  table.p-items{width:100%;border-collapse:collapse;margin-top:4pt;}
  table.p-items th{border-bottom:1.5pt solid #000;font-size:8.6pt;text-align:center;padding:2pt 3pt;font-family:-apple-system,'Segoe UI',sans-serif;}
  table.p-items th:first-child{text-align:left;font-size:9.5pt;}
  table.p-items td{border-bottom:.5pt solid #999;padding:2.6pt 3pt;vertical-align:top;}
  table.p-items td.p-c{text-align:center;width:34pt;font-size:9.5pt;}
  table.p-items td.p-c .sel{display:inline-block;background:#000;color:#fff;border-radius:50%;width:12pt;height:12pt;line-height:12pt;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .p-sectie{font-style:italic;font-weight:700;padding-top:5pt;}
  .p-office{border:1.5pt solid #000;padding:7pt 10pt;margin-top:9pt;page-break-inside:avoid;}
  .p-office h4{font-family:-apple-system,'Segoe UI',sans-serif;font-size:10pt;margin-bottom:4pt;}
  .p-office div{margin:3pt 0;font-size:9.6pt;}
  .p-office .p-l{display:inline-block;border-bottom:1px solid #000;min-width:70pt;padding:0 4pt;font-weight:700;}
  .p-voet{margin-top:8pt;font-size:7.8pt;color:#333;}
  .p-opm{margin-top:6pt;font-size:9.6pt;}
  .p-opm .p-schrijf{border-bottom:.5pt solid #999;height:13pt;margin-top:5pt;}
  .p-breek{page-break-before:always;}
}
.opt.nvt{background:#f3f4f6;}
.opt.nvt:has(input:checked){border-color:#6b7280;background:#e5e7eb;}
.opt.nvt:has(input:checked) .olbl{color:#374151;}
.werkvraag{border:2px solid #93c5fd;background:#eff6ff;border-radius:10px;padding:14px 16px;margin:16px 0;}
.werkvraag.missend{border-color:#f87171;background:#fef2f2;}
.werkvraag .mv-q{font-weight:700;font-size:13.5px;color:#1e3a8a;margin-bottom:6px;}
.werkvraag .mv-u{font-size:12.5px;color:#1e40af;margin-bottom:9px;line-height:1.5;}
.werkvraag .mv-opts{display:flex;gap:8px;flex-wrap:wrap;}
.werkvraag label{display:inline-flex;align-items:center;gap:7px;background:#fff;border:1.5px solid #e5e7eb;border-radius:9px;padding:8px 13px;font-size:13px;cursor:pointer;user-select:none;}
.werkvraag label:has(input:checked){border-color:var(--ind);background:#eef2ff;color:#3730a3;font-weight:600;}
.werkvraag input{accent-color:var(--ind);}
.stam{font-size:13px;font-weight:600;color:#374151;margin:14px 0 6px;font-style:italic;}
.dagen-rij{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:10px;align-items:center;background:#fff;border:1px solid #eef0f4;border-radius:10px;padding:10px 12px;margin-bottom:6px;}
.dagen-rij.beantwoord{border-color:#bbf7d0;background:#fbfefc;}
.dagen-rij.missend{border-color:#f87171;background:#fef2f2;}
.dagen-rij .dtxt{font-size:13.2px;line-height:1.45;color:#1f2937;}
.dagen-rij .dtxt .inr{font-weight:700;color:#6b7280;margin-right:5px;}
.dagen-rij .dinp{display:flex;align-items:center;gap:6px;font-size:12.5px;color:#6b7280;}
.dagen-rij input{width:70px;border:1px solid #e5e7eb;border-radius:8px;padding:8px 10px;font-size:14px;font-family:inherit;text-align:center;}
.dagen-rij input:focus{outline:none;border-color:var(--ind);}
.veld select{width:100%;border:1px solid #e5e7eb;border-radius:8px;padding:9px 11px;font-size:14px;font-family:inherit;background:#fafafa;}
.veld select:focus{outline:none;border-color:var(--ind);background:#fff;}
.sectie-intro{font-size:13px;color:#4b5563;line-height:1.55;margin:4px 0 10px;}
@media(max-width:680px){.dagen-rij{grid-template-columns:1fr;}}
@media print{
  table.p-items td.p-c{width:30pt;font-size:8.5pt;}
  .p-dagen div{margin:3pt 0;font-size:9.6pt;}
  .p-dagen .p-l{display:inline-block;border-bottom:1px solid #000;min-width:40pt;padding:0 4pt;font-weight:700;}
}
</style>
</head>

      <p style="text-align:center;margin-top:16px"><a style="font-size:12px;color:#6b7280;cursor:pointer;text-decoration:underline" onclick="toonPraktijkLogin(true)">Aanmelden als praktijk</a></p>
    </div>
    <div id="auth-praktijk" style="display:none">
      <label>Email</label>
      <input type="email" id="auth-p-email" placeholder="naam@praktijk.be" autocomplete="email">
      <label>Wachtwoord</label>
      <input type="password" id="auth-p-pw" placeholder="&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;" autocomplete="current-password" onkeypress="if(event.key==='Enter')doLogin()">
      <button class="btn-auth" id="auth-p-btn" onclick="doLogin()">Inloggen</button>

    </div>
  </div>
</div>

  if (v === null || v === undefined || v === "") return undefined;
  if (v === "nvt") return "nvt";
  var n = Number(v);
  return isNaN(n) ? undefined : n;
}
function fiRound(x, d) { var f = Math.pow(10, d || 0); return Math.round(x * f) / f; }
function whodasHercodeer(id, raw) {
  var t = WHODAS_HERCODERING[id];
  if (!t || raw === undefined) return undefined;
  return t === "vol" ? raw - 1 : [0, 1, 1, 2, 2][raw - 1];
}
/* Lineaire interpolatie in de normtabel → percentiel (afgerond op 1 decimaal) */
function fiPercentiel(tabel, score) {
  if (score === null || score === undefined) return null;
  if (score <= tabel[0][0]) return tabel[0][1];
  for (var i = 1; i < tabel.length; i++) {
    if (score <= tabel[i][0]) {
      var a = tabel[i - 1], b = tabel[i];
      var p = a[1] + (b[1] - a[1]) * (score - a[0]) / (b[0] - a[0]);
      return fiRound(p, 1);
    }
  }
  return 100;
}

/* ===================== WFIRS-S ===================== */
function fiScoreWfirs(F, antwoorden) {
  var domeinen = [], totSom = 0, totN23 = 0, totBeantwoord = 0, totNvt = 0, onbeantwoord = [];
  F.secties.forEach(function (sec) {
    var som = 0, n = 0, n23 = 0, n2 = 0, n3 = 0, nvt = 0, items = sec.items.length;
    sec.items.forEach(function (it) {
      var v = fiNum(antwoorden, it.id);
      if (v === undefined) { onbeantwoord.push(it.id); return; }
      if (v === "nvt") { nvt++; return; }
      n++; som += v;
      if (v >= 2) n23++;
      if (v === 2) n2++;
      if (v === 3) n3++;
    });
    var gem = n ? fiRound(som / n, 2) : null;
    var beperkt = (n2 >= 2) || (n3 >= 1) || (gem !== null && gem > 1.5);
    var waarom = [];
    if (n2 >= 2) waarom.push(n2 + " items met score 2");
    if (n3 >= 1) waarom.push(n3 + " item(s) met score 3");
    if (gem !== null && gem > 1.5) waarom.push("gemiddelde " + gem.toFixed(2) + " > 1,5");
    domeinen.push({ id: sec.id, label: sec.kortLabel || sec.titel, items: items, beantwoord: n, nvt: nvt,
      n23: n23, som: som, gemiddelde: gem, beperkt: beperkt, detail: waarom.join("; ") });
    totSom += som; totN23 += n23; totBeantwoord += n; totNvt += nvt;
  });
  return { type: "wfirs", domeinen: domeinen, totaal: totSom, totaalN23: totN23, beantwoord: totBeantwoord, nvt: totNvt,
    gemiddelde: totBeantwoord ? fiRound(totSom / totBeantwoord, 2) : null,
    beperkteDomeinen: domeinen.filter(function (d) { return d.beperkt; }).map(function (d) { return d.label; }),
    onbeantwoord: onbeantwoord };
}

/* ===================== WHODAS 2.0 — 36 items ===================== */
function fiScoreWhodas36(F, antwoorden, extra) {
  var werkt = (extra && extra.werkt === "ja");
  var alleItems = [];
  F.secties.forEach(function (sec) { if (sec.conditie === "werkt" && !werkt) return; sec.items.forEach(function (it) { alleItems.push(it.id); }); });
  var onbeantwoord = [], simpel = 0, simpelN = 0, metMoeite = 0;
  alleItems.forEach(function (id) {
    var v = fiNum(antwoorden, id);
    if (v === undefined) { onbeantwoord.push(id); return; }
    simpelN++; simpel += v; if (v >= 2) metMoeite++;
  });
  // complexe score: hercoderen, ontbrekende items (max 2, uit verschillende domeinen) = domeingemiddelde
  var domeinen = [], complexOk = onbeantwoord.length <= 2, somTot = 0, maxTot = 0;
  var dom = WHODAS_DOMEINEN.filter(function (d) { return !(d.werk && !werkt); });
  dom.forEach(function (d) {
    var vals = [], miss = 0;
    d.items.forEach(function (id) { var v = fiNum(antwoorden, id); if (v === undefined) miss++; else vals.push(whodasHercodeer(id, v)); });
    var som = vals.reduce(function (a, b) { return a + b; }, 0);
    var domOk = (miss === 0) || (miss === 1 && vals.length > 0);
    if (miss === 1 && vals.length) som += som / vals.length; // imputatie met domeingemiddelde (hergecodeerd)
    if (miss > 1) complexOk = false;
    var score = domOk ? fiRound(som * 100 / d.max, 1) : null;
    domeinen.push({ id: d.id, label: d.label, items: d.items.length, ontbrekend: miss, score: score, max: d.max });
    if (domOk) { somTot += som; maxTot += d.max; }
  });
  var totaalMax = werkt ? 106 : 92;
  var complex = (complexOk && maxTot === totaalMax) ? fiRound(somTot * 100 / totaalMax, 1) : null;
  var dagen = {};
  ["H1", "H2", "H3"].forEach(function (k) { var v = extra ? fiNum(extra, k) : undefined; dagen[k] = (v === undefined || v === "nvt") ? null : v; });
  return { type: "whodas36", werkt: werkt, aantalItems: alleItems.length, beantwoord: simpelN, simpel: simpel, simpelMax: alleItems.length * 5,
    metMoeite: metMoeite, domeinen: domeinen, complex: complex, complexMax: totaalMax,
    percentiel: complex === null ? null : fiPercentiel(WHODAS_NORM36, complex),
    geimputeerd: onbeantwoord.length > 0 && complex !== null, onbeantwoord: onbeantwoord, dagen: dagen };
}

/* ===================== WHODAS 2.0 — 12 items ===================== */
function fiScoreWhodas12(F, antwoorden, extra) {
  /* Hercodering zoals in de 36-itemversie (via bron36): 6 items 0–4 ("vol") + 6 items 0–2 ("half") → max. 36,
     wat exact overeenkomt met de stappen van 100/36 in tabel 6.2 van de handleiding. */
  var items = F.secties[0].items;
  var onbeantwoord = [], simpel = 0, n = 0, somRec = 0, metMoeite = 0;
  items.forEach(function (it) {
    var v = fiNum(antwoorden, it.id);
    if (v === undefined) { onbeantwoord.push(it.id); return; }
    n++; simpel += v; somRec += whodasHercodeer(it.bron36, v); if (v >= 2) metMoeite++;
  });
  var score = null;
  if (n === 12) score = fiRound(somRec * 100 / 36, 1);
  else if (n === 11) score = fiRound((somRec + somRec / 11) * 100 / 36, 1); // één ontbrekend item = gemiddelde (hergecodeerd) van de overige
  var dagen = {};
  ["H1", "H2", "H3"].forEach(function (k) { var v = extra ? fiNum(extra, k) : undefined; dagen[k] = (v === undefined || v === "nvt") ? null : v; });
  return { type: "whodas12", beantwoord: n, simpel: simpel, simpelMax: 60, metMoeite: metMoeite, score: score,
    percentiel: score === null ? null : fiPercentiel(WHODAS_NORM12, score), geimputeerd: n === 11, onbeantwoord: onbeantwoord, dagen: dagen };
}

function fiComputeScores(F, antwoorden, extra) {
  var t = F.scoring && F.scoring.type;
  if (t === "wfirs") return fiScoreWfirs(F, antwoorden || {});
  if (t === "whodas36") return fiScoreWhodas36(F, antwoorden || {}, extra || {});
  if (t === "whodas12") return fiScoreWhodas12(F, antwoorden || {}, extra || {});
  throw new Error("Onbekend scoringstype");
}

/* Scoreregels voor weergave (arts-scherm, mail, afdruk): [{label, waarde, nadruk?}] + flags */
function fiScoreRegels(F, r) {
  var regels = [], flags = [];
  var pct = function (p) { return p === null ? "—" : "≈ P" + p.toFixed(0); };
  if (r.type === "wfirs") {
    r.domeinen.forEach(function (d) {
      regels.push({ label: d.label + " — items met score 2–3 / totaal / gemiddelde", waarde: d.n23 + " van " + d.beantwoord + " · " + d.som + " · " + (d.gemiddelde === null ? "—" : d.gemiddelde.toFixed(2)) + (d.nvt ? " (" + d.nvt + "× n.v.t.)" : ""), nadruk: d.beperkt });
    });
    regels.push({ label: "Totaal — items met score 2–3", waarde: r.totaalN23 + " van " + r.beantwoord });
    regels.push({ label: "Totaalscore (som, n.v.t. niet meegeteld)", waarde: String(r.totaal) + " (" + r.beantwoord + " beantwoorde items)" });
    regels.push({ label: "Gemiddelde score over alle beantwoorde items", waarde: r.gemiddelde === null ? "—" : r.gemiddelde.toFixed(2) });
    r.domeinen.forEach(function (d) { flags.push({ label: "Domein " + d.label + " beperkt", voldaan: d.beperkt, detail: d.beperkt ? d.detail : "geen van de criteria (≥2 items score 2, ≥1 item score 3, gemiddelde > 1,5)" }); });
  } else if (r.type === "whodas36") {
    regels.push({ label: "Versie", waarde: r.werkt ? "36 items (werkt/studeert: items D5.5–D5.8 meegeteld)" : "32 items (werkt/studeert niet: zonder D5.5–D5.8)" });
    regels.push({ label: "Eenvoudige score (som 1–5)", waarde: r.simpel + " van max. " + r.simpelMax + " (" + r.beantwoord + "/" + r.aantalItems + " beantwoord)" });
    regels.push({ label: "Items met enige moeite (score ≥ 2)", waarde: r.metMoeite + " van " + r.beantwoord });
    r.domeinen.forEach(function (d) { regels.push({ label: "Domein " + d.label + " (0–100)", waarde: d.score === null ? "— (te veel ontbrekend)" : d.score.toFixed(1) }); });
    regels.push({ label: "Complexe (IRT-gebaseerde) totaalscore 0–100", waarde: r.complex === null ? "— (niet berekenbaar: te veel ontbrekende items)" : r.complex.toFixed(1) + (r.geimputeerd ? " (met imputatie)" : ""), nadruk: true });
    regels.push({ label: "Bevolkingspercentiel (tabel 6.1)", waarde: pct(r.percentiel) });
    regels.push({ label: "H1 dagen met moeilijkheden / H2 dagen volledig niet in staat / H3 dagen verminderd", waarde: [r.dagen.H1, r.dagen.H2, r.dagen.H3].map(function (v) { return v === null ? "—" : v; }).join(" / ") });
  } else if (r.type === "whodas12") {
    regels.push({ label: "Eenvoudige score (som 1–5)", waarde: r.simpel + " van max. 60 (" + r.beantwoord + "/12 beantwoord)" });
    regels.push({ label: "Items met enige moeite (score ≥ 2)", waarde: r.metMoeite + " van " + r.beantwoord });
    regels.push({ label: "Korte-versiescore 0–100 (handleiding tabel 6.2)", waarde: r.score === null ? "— (niet berekenbaar: meer dan 1 ontbrekend item)" : r.score.toFixed(1) + (r.geimputeerd ? " (1 item ingevuld met gemiddelde)" : ""), nadruk: true });
    regels.push({ label: "Bevolkingspercentiel (tabel 6.2)", waarde: pct(r.percentiel) });
    regels.push({ label: "H1 dagen met moeilijkheden / H2 dagen volledig niet in staat / H3 dagen verminderd", waarde: [r.dagen.H1, r.dagen.H2, r.dagen.H3].map(function (v) { return v === null ? "—" : v; }).join(" / ") });
  }
  if (r.onbeantwoord.length) regels.push({ label: "Onbeantwoord", waarde: r.onbeantwoord.join(", "), waarschuwing: true });
  return { regels: regels, flags: flags };
}
if (typeof module !== "undefined" && module.exports) { module.exports = { fiComputeScores, fiScoreRegels, fiPercentiel, WHODAS_HERCODERING, WHODAS_DOMEINEN }; }

/* ===================== validatie & verzending ===================== */
function valideer(){
  const F=BANK.formulieren[state.vorm];
  const missendVeld=[],missendItem=[];
  F.velden.forEach(v=>{
    const ok=(state.velden[v.id]||'').trim()!=='';
    const e=el('veld-'+v.id);
    if(v.verplicht&&!ok){missendVeld.push(v.label);if(e)e.classList.add('missend');}
  });
  let werkOk=true;
  if(F.werkvraag&&!state.extra.werkt){werkOk=false;el('werkvraag').classList.add('missend');}
  alleItems(F).forEach(it=>{if(state.antwoorden[it.id]===undefined)missendItem.push(it.id);});
  (F.dagen||[]).forEach(d=>{if(state.extra[d.id]===undefined)missendItem.push(d.id);});
  return {missendVeld,missendItem,werkOk};
}
function toonValidatie(v,magToch){
  let h='';
  if(v.missendVeld.length||!v.werkOk){
    h+='<div class="banner err">Vul eerst de verplichte velden in'
      +(v.missendVeld.length?': <b>'+v.missendVeld.map(esc).join(', ')+'</b>':'')
      +(!v.werkOk?(v.missendVeld.length?' en ':': ')+'de <b>vraag over werk of studie</b>':'')+'.</div>';
  }else if(v.missendItem.length){
    h+='<div class="banner warn">Nog <b>'+v.missendItem.length+'</b> vraag/vragen onbeantwoord ('
      +v.missendItem.slice(0,25).map(esc).join(', ')+(v.missendItem.length>25?'…':'')+'). '
      +'U kan terugkeren en aanvullen, of toch verzenden — onbeantwoorde vragen worden dan als “onbeantwoord” doorgestuurd.'
      +(magToch?'<div style="margin-top:9px"><button class="btn btn-ghost" onclick="scrollNaarEerste()">Terug naar eerste open vraag</button> '
      +'<button class="btn btn-primary" onclick="verzend(\''+MODE+'\',true)">Toch verzenden</button></div>':'')+'</div>';
  }
  el('valideer-msg').innerHTML=h;
  if(h)el('valideer-msg').scrollIntoView({behavior:'smooth',block:'center'});
  return !h;
}
function scrollNaarEerste(){
  const v=valideer();
  if(v.missendItem.length){
    const id=v.missendItem[0];
    const e=el('item-'+sid(id))||el('dag-'+id);
    if(e){e.classList.add('missend');e.scrollIntoView({behavior:'smooth',block:'center'});}
  }
  el('valideer-msg').innerHTML='';
}
function bouwPayload(){
  return {
    action:'submit',
    vorm:state.vorm,
    meta:Object.assign({},state.velden,{bron:MODE==='arts'?'arts':'invuller-login'}),
    antwoorden:state.antwoorden,
    extra:state.extra,
    opmerkingen:state.opmerkingen||'',
    hp:(el('hp-veld')&&el('hp-veld').value)||'',
    verstrekenMs:Date.now()-state.startedAt,
    arts:(MODE==='arts'?null:ARTS_ID)
  };
}
async function verzend(modus,forceer){
  const artsMode=(modus==='arts');
  const v=valideer();
  if(v.missendVeld.length||!v.werkOk){toonValidatie(v,false);return;}
  if(v.missendItem.length&&!forceer){toonValidatie(v,true);return;}
  el('valideer-msg').innerHTML='';
  const btn=el('btn-verzend');const oud=btn.textContent;
  btn.disabled=true;btn.textContent='Bezig met verzenden…';
  try{
    const headers={'Content-Type':'application/json','apikey':SUPABASE_ANON_KEY};
    if(sb){const {data:{session}}=await sb.auth.getSession();if(session)headers['Authorization']='Bearer '+session.access_token;}
    const res=await fetch(FN_URL,{method:'POST',headers,body:JSON.stringify(bouwPayload())});
    const data=await res.json().catch(()=>({}));
    if(!res.ok||data.error)throw new Error(data.error||('HTTP '+res.status));
    clearDraft(state.vorm);
    if(artsMode){
      el('valideer-msg').innerHTML='<div class="banner ok">Verzonden naar je mailbox &#10003;</div>';
      btn.disabled=false;btn.textContent=oud;
    }else{
      laatsteInzending={vorm:state.vorm,state:JSON.parse(JSON.stringify(state))};
      toonBevestiging();
    }
  }catch(e){
    el('valideer-msg').innerHTML='<div class="banner err"><b>Verzenden is niet gelukt.</b> '+esc(e.message||'Onbekende fout')
      +'<br>Uw antwoorden staan nog steeds in het formulier — probeer het zo dadelijk opnieuw. Blijft het misgaan, neem dan contact op met '+(isFrank()?'de praktijk: neurologie@drvansteenkiste.be':'uw behandelaar')+'</div>';
    el('valideer-msg').scrollIntoView({behavior:'smooth',block:'center'});
    btn.disabled=false;btn.textContent=oud;
  }
}

    const headers={'Content-Type':'application/json','apikey':SUPABASE_ANON_KEY};
    if(sb){const {data:{session}}=await sb.auth.getSession();if(session)headers['Authorization']='Bearer '+session.access_token;}
    const res=await fetch(FN_UITNODIGING,{method:'POST',headers,body:JSON.stringify({aan,onderwerp,tekst,vorm:code})});
    const data=await res.json().catch(()=>({}));
    if(!res.ok||data.error)throw new Error(data.error||('HTTP '+res.status));
    el('mail-panel').innerHTML='<div class="banner ok">Uitnodiging voor <b>'+esc(BANK.formulieren[code].kort)+'</b> verstuurd naar '+esc((data.aan||aan).join(', '))+' &#10003;</div>';
    el('link-status').textContent='';
  }catch(e){
    st.innerHTML='<span style="color:#b91c1c"><b>Versturen is niet gelukt.</b> '+esc(e.message||'Onbekende fout')+'</span>';
    btn.disabled=false;btn.textContent='Versturen';
  }
}

/* ===================== invuller zonder geldige link ===================== */
function renderInvullerDashboard(){
  MODE='invuller';
  let h='<div class="top"><div><span class="brand">the<span class="accent">fallacy</span>machine</span>'
    +'<span class="brand-sub">WHODAS 2.0 &middot; '+praktijkNaam()+'</span></div>'
    +'<div class="top-right"><span class="user-pill"><span class="dot"></span><span>'+esc(currentUser&&currentUser.email||'')+'</span></span>'
    +'<button class="btn-logout" onclick="doLogout()">Afmelden</button></div></div>';
  h+='<div class="banner info"><b>Deze pagina werkt enkel via de persoonlijke link die u van de praktijk kreeg.</b><br>'
    +'Open de link uit de e-mail of het bericht van '+esc(behNaam())+' opnieuw; u komt dan rechtstreeks bij de gevraagde vragenlijst terecht. '
    +'Hebt u geen link ontvangen, neem dan contact op met de praktijk.</div>';
  h+='<div class="footer-teksten"><div class="klein">'+esc(privacyTekst())+'</div></div>';
  el('app').innerHTML=h;el('app').style.display='block';window.scrollTo(0,0);
}

/* ===================== auth & init ===================== */
function toonPraktijkLogin(aan){
  el('auth-invuller').style.display=aan?'none':'block';
  el('auth-praktijk').style.display=aan?'block':'none';
  el('auth-msg').innerHTML='';
}
async function stuurMagicLink(){
  const email=el('auth-email').value.trim();
  const btn=el('auth-btn'),msg=el('auth-msg');
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){msg.innerHTML='<div class="msg err">Vul een geldig e-mailadres in</div>';return;}
  btn.disabled=true;btn.textContent='Bezig…';
  const redirect=location.origin+location.pathname+location.search;
  const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:redirect}});
  btn.disabled=false;btn.textContent='Stuur mij een aanmeldlink';
  if(error){msg.innerHTML='<div class="msg err">'+esc(error.message)+'</div>';return;}
  msg.innerHTML='<div class="msg" style="background:#dcfce7;color:#166534;border:1px solid #86efac">E-mail verzonden naar <b>'+esc(email)+'</b>.<br>Open uw mailbox en klik op de aanmeldlink — u komt dan meteen op de invulpagina terecht. U mag dit venster sluiten.</div>';
}
async function doLogin(){
  const email=el('auth-p-email').value.trim(),pw=el('auth-p-pw').value;
  const btn=el('auth-p-btn'),msg=el('auth-msg');
  if(!email||!pw){msg.innerHTML='<div class="msg err">Vul email en wachtwoord in</div>';return;}
  btn.disabled=true;btn.textContent='Bezig…';
  const {error}=await sb.auth.signInWithPassword({email,password:pw});
  btn.disabled=false;btn.textContent='Inloggen';
  if(error){msg.innerHTML='<div class="msg err">'+esc(error.message)+'</div>';return;}
  msg.innerHTML='';onLoggedIn();
}
async function doLogout(){await sb.auth.signOut();currentUser=null;IS_ARTS=false;el('app').style.display='none';toonPraktijkLogin(false);el('auth-overlay').style.display='flex';}
async function onLoggedIn(){
  const {data:{user}}=await sb.auth.getUser();
  currentUser=user;
  try{
    const {data:access}=await sb.from('user_tool_access').select('tool_id').eq('user_id',user.id).eq('tool_id',TOOL_ID).maybeSingle();
    IS_ARTS=!!access;
  }catch(_){IS_ARTS=false;}
  el('auth-overlay').style.display='none';
  if(VORM&&BANK.formulieren[VORM]){renderForm(VORM,IS_ARTS?'arts':'invuller');}
  else if(IS_ARTS){renderDashboard();}
  else{renderInvullerDashboard();}
}
(function init(){
  try{ if(!isFrank()){ const sub=document.querySelector('#auth-overlay .sub'); if(sub) sub.textContent='Praktijk — vragenlijsten'; } }catch(_){}
  if(!window.supabase){
    document.body.insertAdjacentHTML('afterbegin','<div class="wrap"><div class="banner err">De pagina kon niet volledig laden. Controleer uw internetverbinding en vernieuw de pagina.</div></div>');
    return;
  }
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  sb.auth.getSession().then(({data:{session}})=>{ if(session)onLoggedIn(); else el('auth-overlay').style.display='flex'; });
  sb.auth.onAuthStateChange((event)=>{ if(event==='SIGNED_IN'&&!currentUser){onLoggedIn();} });
})();
</script>
